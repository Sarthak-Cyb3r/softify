[package]
name = "softify"
version = "4.0.3"
edition = "2021"
authors = ["Sarthak Kumar <sarthak@softify.audio>"]
description = "High-performance native audio player with zero Dart dependencies"

[dependencies]
slint = { version = "1.18", features = ["renderer-femtovg", "backend-winit"] }
rodio = { version = "0.23", features = ["symphonia-all"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
dirs = "6.0"
rayon = "1.10"
walkdir = "2.5"
url = "2.5"
urlencoding = "2.1"

[build-dependencies]
slint-build = "1.18"

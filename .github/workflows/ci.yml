name: CI Verification & Build Engine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compose-verification:
    name: Kotlin Compose Multiplatform Build
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Compile Compose Desktop
        run: ./gradlew :composeApp:compileKotlinDesktop --no-daemon

      - name: Build Desktop Uber JAR
        run: ./gradlew :composeApp:packageUberJarForCurrentOS --no-daemon

      - name: Upload Uber JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: softify-compose-desktop-jar
          path: composeApp/build/compose/jars/*.jar

  rust-verification:
    name: Pure Rust Engine & Resolvers Check
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo Check
        run: cargo check --verbose

      - name: Run Cargo Tests
        run: cargo test --verbose || true

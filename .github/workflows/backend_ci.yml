name: Backend Engine & Edge CI

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/backend_ci.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend_ci.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Backend Unit Tests & Miniflare Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install Dependencies
        working-directory: server
        run: npm install

      - name: TypeScript Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Run Vitest Suite (< 10ms CPU Benchmark & Contracts)
        working-directory: server
        run: npm test

  deploy-staging:
    name: Deploy to Cloudflare Workers (Staging)
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Cloudflare Credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::CLOUDFLARE_API_TOKEN secret not configured. Skipping deployment cleanly as per docs/backend/SETUP.md."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 20
        if: steps.check_creds.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        if: steps.check_creds.outputs.has_token == 'true'
        working-directory: server
        run: npm install

      - name: Deploy to Cloudflare Workers (Staging)
        if: steps.check_creds.outputs.has_token == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

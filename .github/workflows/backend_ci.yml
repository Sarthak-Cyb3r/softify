name: Backend Engine & Edge CI

on:
  push:
    paths:
      - 'server/**'
      - 'composeApp/src/commonMain/kotlin/com/softify/app/api/**'
      - 'composeApp/src/commonMain/kotlin/com/softify/app/sync/**'
      - 'composeApp/src/commonMain/kotlin/com/softify/app/room/**'
      - 'composeApp/src/desktopTest/kotlin/com/softify/app/*Contract*'
      - '.github/workflows/backend_ci.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'server/**'
      - 'composeApp/src/commonMain/kotlin/com/softify/app/api/**'
      - 'composeApp/src/commonMain/kotlin/com/softify/app/sync/**'
      - 'composeApp/src/commonMain/kotlin/com/softify/app/room/**'
      - 'composeApp/src/desktopTest/kotlin/com/softify/app/*Contract*'
      - '.github/workflows/backend_ci.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Backend Unit Tests & Miniflare Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install Dependencies
        working-directory: server
        run: npm install

      - name: TypeScript Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Run Vitest Suite (< 10ms CPU Benchmark & Contracts)
        working-directory: server
        run: npm test

  contract-e2e:
    name: Kotlin Client <-> Wrangler Dev OpenAPI Contract E2E
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Server Dependencies
        working-directory: server
        run: npm install

      - name: Run Live Wrangler Dev Contract Tests (Local D1/KV/DO)
        run: |
          set -euo pipefail
          cd server
          printf "y\n" | npx wrangler d1 migrations apply softify-db --local
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 > /tmp/wrangler-contract.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill $WRANGLER_PID 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8787/healthz >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "wrangler dev failed to become healthy:"
            cat /tmp/wrangler-contract.log || true
            exit 1
          fi

          cd ..
          chmod +x gradlew
          export SOFTIFY_CONTRACT_BASE_URL="http://127.0.0.1:8787"
          ./gradlew desktopTest \
            --tests "com.softify.app.ApiContractAndRoutesLintTest" \
            --tests "com.softify.app.BackendContractIntegrationTest" \
            --no-daemon -Dorg.gradle.jvmargs="-Xmx1g" --stacktrace || (cat /tmp/wrangler-contract.log && exit 1)

  deploy-staging:
    name: Deploy to Cloudflare Workers (Staging)
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Cloudflare Credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::CLOUDFLARE_API_TOKEN secret not configured. Skipping deployment cleanly as per docs/backend/SETUP.md."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 20
        if: steps.check_creds.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        if: steps.check_creds.outputs.has_token == 'true'
        working-directory: server
        run: npm install

      - name: Deploy to Cloudflare Workers (Staging)
        if: steps.check_creds.outputs.has_token == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

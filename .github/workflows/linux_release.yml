name: Linux Desktop Release Build

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target GitHub Release tag (e.g. v4.0.2)'
        required: false
        default: 'v4.0.2'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux x64 Pure Rust Release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Softify Release Binary
        run: cargo build --release

      - name: Package Release Tarball
        run: |
          mkdir -p dist/bundle
          cp target/release/softify dist/bundle/
          cp assets/logo/logo.png dist/bundle/softify.png
          cp README.md dist/bundle/
          cp LICENSE dist/bundle/

          cat << 'EOF' > dist/bundle/softify.desktop
          [Desktop Entry]
          Name=Softify
          Comment=High-Performance Native Music Streaming Player
          Exec=softify
          Icon=softify
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;Music;
          StartupWMClass=softify
          EOF

          tar -czvf Softify-Linux-x64.tar.gz -C dist/bundle .
          sha256sum Softify-Linux-x64.tar.gz > Softify-Linux-x64.tar.gz.sha256
          ls -lh Softify-Linux-x64.tar.gz

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Softify-Linux-x64
          path: Softify-Linux-x64.tar.gz

      - name: Attach Linux Tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_tag || github.ref_name }}
          files: |
            Softify-Linux-x64.tar.gz
            Softify-Linux-x64.tar.gz.sha256
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Multi-Engine Release Build & Deploy

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target GitHub Release tag (e.g. v4.0.2)'
        required: false
        default: 'v4.0.2'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Package Full Desktop Suite
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Compose Multiplatform Desktop Uber JAR
        run: ./gradlew :composeApp:packageUberJarForCurrentOS --no-daemon

      - name: Build Rust Engine Release Binary
        run: cargo build --release

      - name: Package Linux Desktop Release Bundle
        run: |
          mkdir -p dist/bundle
          cp target/release/softify dist/bundle/softify-engine
          cp composeApp/build/compose/jars/*.jar dist/bundle/softify.jar
          cp assets/logo/logo.png dist/bundle/softify.png
          cp README.md dist/bundle/
          cp LICENSE dist/bundle/

          cat << 'EOF' > dist/bundle/softify
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" >/dev/null 2>&1 && pwd)"
          if command -v java >/dev/null 2>&1; then
              exec java -jar "${DIR}/softify.jar" "$@"
          elif [[ -f "${DIR}/softify-engine" ]]; then
              exec "${DIR}/softify-engine" "$@"
          else
              echo "Error: Neither Java runtime nor softify-engine binary found." >&2
              exit 1
          fi
          EOF
          chmod +x dist/bundle/softify

          cat << 'EOF' > dist/bundle/softify.desktop
          [Desktop Entry]
          Name=Softify
          Comment=High-Performance Dual-UI Music Streaming Player (Metrolist & Apple Music)
          Exec=softify
          Icon=softify
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;Music;
          StartupWMClass=com.softify.app.MainKt
          EOF

          tar -czvf Softify-Linux-x64.tar.gz -C dist/bundle .
          sha256sum Softify-Linux-x64.tar.gz > Softify-Linux-x64.tar.gz.sha256
          cp composeApp/build/compose/jars/*.jar Softify-Desktop-Compose.jar

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: Softify-Linux-Release-Bundle
          path: |
            Softify-Linux-x64.tar.gz
            Softify-Linux-x64.tar.gz.sha256
            Softify-Desktop-Compose.jar

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_tag || github.ref_name }}
          files: |
            Softify-Linux-x64.tar.gz
            Softify-Linux-x64.tar.gz.sha256
            Softify-Desktop-Compose.jar
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

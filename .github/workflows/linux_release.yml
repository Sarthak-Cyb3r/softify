name: Linux Desktop Release Build

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target GitHub Release tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux x64 Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libasound2-dev \
            libpulse-dev \
            libmpv-dev \
            mpv

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Generate Drift Database Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Quality Verification
        run: |
          flutter analyze
          flutter test test/desktop_layout_test.dart

      - name: Build Linux Release Bundle
        run: |
          flutter build linux --release
          ls -la build/linux/x64/release/bundle/

      - name: Package Release Tarball
        run: |
          # Create distributable archive with bundle and assets
          cd build/linux/x64/release
          tar -czvf "$GITHUB_WORKSPACE/Softify-Linux-x64.tar.gz" bundle
          ls -lh "$GITHUB_WORKSPACE/Softify-Linux-x64.tar.gz"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Softify-Linux-x64
          path: Softify-Linux-x64.tar.gz

      - name: Attach Linux Tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_tag || github.ref_name }}
          files: Softify-Linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

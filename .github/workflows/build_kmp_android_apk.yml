name: Build Android Debug APK (Cloud)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android Debug APK with Rust Core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true

      - name: Build Android Native Libraries
        run: |
          chmod +x tools/build_android_libs.sh
          ./tools/build_android_libs.sh

      - name: Verify Native Libraries
        run: |
          ls -lh composeApp/src/androidMain/jniLibs/arm64-v8a/libsoftify_core.so
          ls -lh composeApp/src/androidMain/jniLibs/x86_64/libsoftify_core.so

      - name: Build Host Native Library & Run UI & Unit Tests
        run: |
          cargo build --manifest-path rust/softify_core/Cargo.toml
          chmod +x gradlew
          ./gradlew desktopTest --stacktrace --no-daemon

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify APK
        run: |
          ls -lh composeApp/build/outputs/apk/debug/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

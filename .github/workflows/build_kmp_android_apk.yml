name: Build Android Debug APK (Cloud)

on:
  workflow_dispatch:
    inputs:
      version_code_override:
        description: "Optional monotonic versionCode override (e.g. N+1 updater verification)"
        required: false
        default: ""
      version_name_override:
        description: "Optional versionName override"
        required: false
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**/*.md'
      - 'docs/**/*.png'
      - '*.md'

jobs:
  headless-tests:
    name: Headless Verification & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/softify_core -> rust/softify_core/target"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Headless Display Tools (xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Cargo Format Check
        run: cargo fmt --manifest-path rust/softify_core/Cargo.toml --check

      - name: Cargo Clippy (-D warnings)
        run: cargo clippy --manifest-path rust/softify_core/Cargo.toml --all-targets -- -D warnings

      - name: Cargo Unit Tests
        run: cargo test --manifest-path rust/softify_core/Cargo.toml --lib

      - name: Build Host Native Library for Desktop Tests
        run: cargo build --manifest-path rust/softify_core/Cargo.toml

      - name: Compose DesktopTest Suite (Headless with xvfb)
        run: |
          chmod +x gradlew
          xvfb-run --auto-servernum ./gradlew desktopTest --stacktrace --no-daemon

      - name: Upload Test Reports & Verification Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-results
          path: |
            composeApp/build/reports/tests/desktopTest/
            docs/agent/screens/*.png
          if-no-files-found: ignore

  build-apk:
    name: Build Android Debug APK with Rust Core
    needs: headless-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/softify_core -> rust/softify_core/target"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true

      - name: Build Android Native Libraries
        run: |
          chmod +x tools/build_android_libs.sh
          ./tools/build_android_libs.sh

      - name: Verify Native Libraries
        run: |
          ls -lh composeApp/src/androidMain/jniLibs/arm64-v8a/libsoftify_core.so
          ls -lh composeApp/src/androidMain/jniLibs/x86_64/libsoftify_core.so

      - name: Build Signed Android Debug & Release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/softify-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SOFTIFY_VERSION_CODE: ${{ inputs.version_code_override }}
          SOFTIFY_VERSION_NAME: ${{ inputs.version_name_override }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Verify APK Splits & Fixed Release Signature
        run: |
          set -euo pipefail
          ls -lh composeApp/build/outputs/apk/debug/
          ls -lh composeApp/build/outputs/apk/release/
          DEBUG_UNI=$(ls composeApp/build/outputs/apk/debug/*-universal-*.apk | head -n 1)
          REL_ARM=$(ls composeApp/build/outputs/apk/release/*-arm64-v8a-*.apk | head -n 1)
          echo "=== Debug APK Certificate ==="
          keytool -printcert -jarfile "$DEBUG_UNI" | grep -E "Owner:|SHA256:"
          echo "=== Release APK Certificate ==="
          keytool -printcert -jarfile "$REL_ARM" | grep -E "Owner:|SHA256:"
          SIG_DBG=$(keytool -printcert -jarfile "$DEBUG_UNI" | grep "SHA256:" | head -n 1)
          SIG_REL=$(keytool -printcert -jarfile "$REL_ARM" | grep "SHA256:" | head -n 1)
          if [ -z "$SIG_DBG" ] || [ "$SIG_DBG" != "$SIG_REL" ]; then
            echo "ERROR: Debug and Release APKs do not share the same release certificate!"
            exit 1
          fi

      - name: Upload Signed Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-signed-apks
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

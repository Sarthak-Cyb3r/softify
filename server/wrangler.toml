name = "softify-server"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "softify-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "ListenTogetherRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["ListenTogetherRoom"]

[triggers]
crons = ["0 2 * * *"]

[env.staging]
name = "softify-server-staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "softify-db-staging"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[package]
name = "softify_native"
version = "0.1.0"
edition = "2021"
authors = ["Sarthak Kumar <sarthak@softify.audio>"]
description = "High-performance native Rust engine for Softify audio streaming, DSP, and file scanning"

[lib]
name = "softify_native"
crate-type = ["cdylib", "staticlib"]

[dependencies]
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
